function normalizeModule(m={}){
  const id=m.id||'';
  const path=m.path||null;
  return{ id, name:m.name||id, icon:m.icon||'◻️', route:m.route||id, path, badge:m.badge||'', color:m.color||'#64748b', bg:m.bg||'#f1f5f9', desc:m.desc||'', actions:Array.isArray(m.actions)?m.actions:[], action:m.action||'', render:MODULE_RENDERERS[id]||(path?renderToolFrame:null) };
}
function buildModuleRegistry(config){
  const source=Array.isArray(config)&&config.length?config:DEFAULT_MODULES_CONFIG;
  const toolModules=source.map(normalizeModule).filter(m=>m.id&&m.render);
  const coreModules=[
    {id:'home',route:'dashboard',name:'Dashboard',icon:'🏠',path:null,badge:'',color:'#1A75BB',bg:'#eff6ff',desc:'Panel principal',render:MODULE_RENDERERS.home},

  ];
  MODULE_REGISTRY=[coreModules[0],...toolModules,coreModules[1]];
  DASHBOARD_MODULES=toolModules;
  MODULE_BY_ID=Object.fromEntries(MODULE_REGISTRY.map(m=>[m.id,m]));

function appBasePath(){const marker='/modules/';const idx=window.location.pathname.indexOf(marker);return idx>=0?window.location.pathname.slice(0,idx):'';}
function resolveAppPath(path){if(!path)return path;if(/^https?:|^data:|^blob:/.test(path))return path;const clean=path.replace(/^\.\//,'').replace(/^\//,'');return window.location.origin+appBasePath()+'/'+clean;}
async function loadModuleConfig(){
  for(const url of [...new Set(['/config/modules.json',resolveAppPath('/config/modules.json')])]){
    try{
      const res=await fetch(url,{cache:'no-cache'});
      if(!res.ok)throw new Error('modules.json '+res.status);

      buildModuleRegistry(await res.json());
      return;
    }catch(e){}
  }
  buildModuleRegistry(DEFAULT_MODULES_CONFIG);
}
function moduleBadge(m){return DYNAMIC_BADGES[m.id]?DYNAMIC_BADGES[m.id]():m.badge;}
async function loadAIRouter(){

      if(window.WashAI&&typeof window.WashAI.routeAI==='function')console.log('WASH AI Router loaded');
      else console.warn('WASH AI Router loaded without routeAI');
      resolve();
    };
    script.onerror=()=>{console.warn('WASH AI Router could not be loaded');resolve();};
    document.head.appendChild(script);
  });
}

const scrollPositions={};
let renderedView=null,routeFrame=null;
if('scrollRestoration' in window.history)window.history.scrollRestoration='manual';
function normalizeHashRoute(hash){const raw=(hash||'').replace(/^#\/?/,'').split(/[?#]/)[0].replace(/^\/+|\/+$/g,'')||'dashboard';return (MODULE_BY_ROUTE[raw]||MODULE_BY_ID.home).id;}
function routeForView(v){return (MODULE_BY_ID[v]||MODULE_BY_ID.home).route;}
function currentScrollY(){return window.pageYOffset||document.documentElement.scrollTop||document.body.scrollTop||0;}
function saveViewScroll(){if(renderedView)scrollPositions[renderedView]=currentScrollY();}
function go(v){const module=MODULE_BY_ID[v]||MODULE_BY_ROUTE[v]||MODULE_BY_ID.home;const nextView=module.id;const nextHash='#/'+module.route;if(window.location.hash!==nextHash){window.location.hash=nextHash;return;}renderView(nextView,{force:true,preserveScroll:true});}
function openDashboardCard(el){
  const action=el&&el.dataset?el.dataset.action:'';
  const target=el&&el.dataset?el.dataset.view:'';
  if(action){openTool(action);return;}
  if(target&&target!==view)go(target);
}
async function init(){await loadAIRouter();await loadAll();await loadModuleConfig();if(!window.location.hash)window.history.replaceState(null,'','#/dashboard');syncRoute();}

function renderView(v,opts={}){
  const module=MODULE_BY_ID[v]||MODULE_BY_ROUTE[v]||MODULE_BY_ID.home;
  const next=module.id;
  const app=document.getElementById('app');
  const force=opts.force===true;
  if(!force&&renderedView===next){view=next;return;}
  const previousY=currentScrollY();
  saveViewScroll();
  view=next;
  if(routeFrame)cancelAnimationFrame(routeFrame);
  app.classList.add('view-transitioning');
  app.innerHTML=(module.render?module.render(module):renderHome());
  postRender();
  renderedView=view;
  const targetY=opts.preserveScroll?previousY:(scrollPositions[view]||0);
  routeFrame=requestAnimationFrame(()=>{
    window.scrollTo({top:targetY,left:0,behavior:'auto'});
    app.classList.remove('view-transitioning');
    routeFrame=null;
  });
}
function renderApp(){renderView(view,{force:true,preserveScroll:true});}
function syncRoute(){renderView(normalizeHashRoute(window.location.hash));}
window.addEventListener('hashchange',syncRoute);

function getSelected(gridId){return[...document.querySelectorAll('#'+gridId+' .chip.on')].map(c=>c.dataset.v);}
function setIInput(m){

const MAX_IND=130000;
async function handleIndDoc(file){
  if(!file)return;
  const ext=file.name.split('.').pop().toLowerCase();
  iDocFileName=file.name;
  document.getElementById('ind-doc-name').textContent=file.name;
  document.getElementById('ind-doc-info').textContent='Leyendo...';
  document.getElementById('ind-doc-ok').style.display='none';
  document.getElementById('ind-doc-warn').style.display='none';
  try{
    let t='';
    if(ext==='txt'||ext==='csv'){t=await file.text();}
    else if(ext==='pdf'){
      pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
      const pdf=await pdfjsLib.getDocument({data:await file.arrayBuffer()}).promise;
      let hasText=false;
      for(let i=1;i<=Math.min(pdf.numPages,90);i++){const pg=await pdf.getPage(i);const c=await pg.getTextContent();const pt=c.items.map(s=>s.str).join(' ');if(pt.trim().length>10)hasText=true;t+='\n[Página '+i+']\n'+pt+'\n';if(t.length>MAX_IND)break;}
      if(!hasText){const w=document.getElementById('ind-doc-warn');w.style.display='block';w.textContent='⚠ Este PDF parece ser escaneado. El texto puede ser limitado.';}
    }
    else if(ext==='docx'||ext==='doc'){t=(await mammoth.extractRawText({arrayBuffer:await file.arrayBuffer()})).value;}
    else if(ext==='pptx'){
      const zip=await JSZip.loadAsync(await file.arrayBuffer());
      const slides=Object.keys(zip.files).filter(n=>n.match(/ppt\/slides\/slide\d+\.xml$/)).sort((a,b)=>+a.match(/\d+/)[0]-+b.match(/\d+/)[0]);
      for(let i=0;i<slides.length;i++){const xml=await zip.files[slides[i]].async('string');t+='\n[Diapositiva '+(i+1)+']\n'+xml.replace(/<[^>]+>/g,' ').replace(/\s+/g,' ').trim()+'\n';if(t.length>MAX_IND)break;}
    }
    else if(ext==='xlsx'||ext==='xls'){
      try{
        const zip=await JSZip.loadAsync(await file.arrayBuffer());
        let strings=[];
        if(zip.files['xl/sharedStrings.xml']){const xml=await zip.files['xl/sharedStrings.xml'].async('string');strings=(xml.match(/<t[^>]*>([^<]*)<\/t>/g)||[]).map(m=>m.replace(/<[^>]+>/g,''));}
        const sheets=Object.keys(zip.files).filter(n=>n.match(/xl\/worksheets\/sheet\d+\.xml$/)).sort();
        for(let s=0;s<sheets.length;s++){
          const xml=await zip.files[sheets[s]].async('string');
          t+='\n[Hoja '+(s+1)+']\n';
          const cells=xml.match(/<c [^>]*>[\s\S]*?<\/c>/g)||[];
          const rowData={};
          cells.forEach(cell=>{const r=cell.match(/r="([A-Z]+)(\d+)"/);const tv=cell.match(/t="s"/);const vM=cell.match(/<v>(\d+)<\/v>/);const vtM=cell.match(/<v>([^<]+)<\/v>/);if(r){const row=r[2];if(!rowData[row])rowData[row]=[];if(tv&&vM&&strings[parseInt(vM[1])]!==undefined){rowData[row].push(strings[parseInt(vM[1])]);}else if(vtM){rowData[row].push(vtM[1]);}}});
          Object.keys(rowData).sort((a,b)=>parseInt(a)-parseInt(b)).forEach(row=>{t+=rowData[row].join('\t')+'\n';});
          if(t.length>MAX_IND)break;
        }
      }catch(ex){t='[Excel: '+ex.message+']';}
    }
    else{t=await file.text();}
    if(t.length>MAX_IND) t=t.slice(0,MAX_IND);
    iDocText=t;
    const pages=Math.round(t.length/1800);
    document.getElementById('ind-doc-info').textContent=(file.size/1024).toFixed(0)+' KB · ~'+pages+' págs.';
    const ok=document.getElementById('ind-doc-ok');ok.style.display='block';ok.textContent='✓ '+ext.toUpperCase()+' procesado — '+t.length.toLocaleString()+' caracteres';
  }catch(e){document.getElementById('ind-doc-info').textContent='Error: '+e.message;}
}

function indLog(msg,c='#16a34a'){const b=document.getElementById('ind-log');if(!b)return;const d=document.createElement('div');d.style.color=c;d.textContent='› '+msg;b.appendChild(d);b.scrollTop=b.scrollHeight;}

function extraerIndicadores(){
  const texto=iInputMode==='texto'?document.getElementById('ind-txt')?.value.trim():iDocText.trim();
  if(!texto||texto.length<20){alert('Agrega el documento o texto a analizar.');return;}
  const sectores=getSelected('sector-grid');
  const etarios=[...getSelected('etario-grid'),...getSelected('grupo-grid')];
  const sexos=getSelected('sexo-grid');
  const conResumen=document.getElementById('chk-resumen')?.checked;
  const conMeta=document.getElementById('chk-meta')?.checked;
  if(!sectores.length){alert('Selecciona al menos un sector.');return;}
  document.getElementById('ind-prog').style.display='block';
  document.getElementById('ind-result').style.display='none';
  document.getElementById('ind-log').innerHTML='';
  document.getElementById('ind-paste').style.display='none';
  indProg(20,'Preparando extracción...');
  indLog('Sectores: '+sectores.join(', '));
  indLog('Texto: '+texto.length.toLocaleString()+' chars');
  const prompt=`Eres un especialista en análisis de datos de UNICEF, OPS, OMS, MINSA, OCHA.

TAREA: Extrae TODOS los indicadores numéricos y estadísticos del documento.

SECTORES: ${sectores.map(s=>s.toUpperCase()).join(', ')}
${sectores.includes('otros')?'Captura también cualquier indicador que NO pertenezca a los sectores anteriores — clasificarlo como "otros".':''}
GRUPOS ETARIOS: ${etarios.length?etarios.join(', '):'todos'}
SEXO: ${sexos.join(', ')||'todos'}

REGLAS:
- Extrae TODOS los indicadores con valores numéricos (%, cifras, tasas, ratios)
- Si no hay desagregación, usa "no especificado"
- Copia valores EXACTAMENTE como aparecen
- ${conMeta?'Busca metas o líneas base':'No busques metas'}

function cargarIndicadores(){
  const raw=document.getElementById('ind-json-input')?.value.trim();if(!raw){alert('Pega el JSON primero.');return;}
  let parsed;
  try{const m=raw.replace(/```json|```/g,'').trim().match(/\{[\s\S]*\}/);parsed=JSON.parse(m?m[0]:raw);}
  catch(e){alert('JSON inválido.');return;}
  indicadores=(parsed.indicadores||[]);docResumen=parsed.resumen||'';
  if(!indicadores.length){alert('No se encontraron indicadores.');return;}
  indProg(100,'¡Completado!');indLog('✓ '+indicadores.length+' indicadores','#16a34a');
  document.getElementById('ind-paste').style.display='none';
  guardarExtraccion();
  setTimeout(mostrarIndicadores,300);
}

async function guardarExtraccion(){
  historialIndicadores.unshift({archivo:iDocFileName||'texto pegado',resumen:docResumen,total:indicadores.length,sectores:[...new Set(indicadores.map(i=>i.sector))],indicadores,ts:Date.now()});
  await saveHist('hist-indicadores',historialIndicadores);
}

function mostrarIndicadores(){
  const resBox=document.getElementById('ind-resumen-box'),resText=document.getElementById('ind-resumen-texto');

  document.getElementById('ind-stats').innerHTML=[

    {n:indicadores.filter(i=>i.sector==='wash').length,l:'WASH',c:'#0C447C',bg:'#E6F1FB'},
    {n:sectores.length,l:'Sectores',c:'#6d28d9',bg:'#f5f3ff'},
    {n:indicadores.filter(i=>i.meta&&i.meta.trim()&&i.meta!=='—'&&i.meta!=='-').length,l:'Con meta',c:'#16a34a',bg:'#f0fdf4'},
  ].map(s=>`<div style="background:${s.bg};border:1px solid #e2e8f0;border-radius:11px;padding:12px;text-align:center"><div style="font-size:24px;font-weight:600;color:${s.c}">${s.n}</div><div style="font-size:10px;color:#64748b;margin-top:3px">${s.l}</div></div>`).join('');

}

function setIndFilter(f,el){
  iFilterSector=f;
  document.querySelectorAll('#ind-filters button').forEach(b=>{const on=b===el;b.style.background=on?'#0ea5e9':'#fff';b.style.color=on?'#fff':'#64748b';b.style.borderColor=on?'#0ea5e9':'#e2e8f0';});

px;text-align:center"><span style="font-size:10px;padding:2px 6px;border-radius:99px;${SECTOR_COLORS[ind.sector||'otros']||SECTOR_COLORS.otros}">${ind.sector||'—'}</span></td><td style="padding:7px 8px;text-align:center;color:#64748b">${ind.periodo||'—'}</td></tr>`).join('')}</tbody></table></div></div>`).join('')}

function emptyHist(tipo){return`<div style="text-align:center;padding:40px;color:#94a3b8;font-size:13px;background:#fff;border-radius:12px;border:1px solid #e2e8f0">Sin ${tipo} guardados aún.<br>Usa la herramienta y se guardará aquí automáticamente.</div>`;}
function toggleHist(id){const el=document.getElementById(id);if(el)el.style.display=el.style.display==='block'?'none':'block';}
function hSwitch(tab,btn){['reuniones','traducciones','reportes','mejoras','indicadores'].forEach(t=>{const p=document.getElementById('hpanel-'+t),b=document.getElementById('htab-'+t);if(p)p.style.display=t===tab?'':'none';if(b){b.style.background=t===tab?'#6366f1':'transparent';b.style.color=t===tab?'#fff':'#64748b';}});}

async function exportarTodo(){const data={version:'7.0',exportado:new Date().toISOString(),tasks,historialReuniones,historialTraducciones,historialReportes,historialMejoras,historialIndicadores};dlBlob(JSON.stringify(data,null,2),'caja_herramientas_frank_backup_'+todayStr+'.json','application/json');}
async function importarTodo(input){const file=input.files[0];if(!file)return;try{const data=JSON.parse(await file.text());if(data.tasks)tasks=data.tasks;if(data.historialReuniones)historialReuniones=data.historialReuniones;if(data.historialTraducciones)historialTraducciones=data.historialTraducciones;if(data.historialReportes)historialReportes=data.historialReportes;if(data.historialMejoras)historialMejoras=data.historialMejoras;if(data.historialIndicadores)historialIndicadores=data.historialIndicadores;await saveTasks();await saveHist('hist-reuniones',historialReuniones);await saveHist('hist-traducciones',historialTraducciones);await saveHist('hist-reportes',historialReportes);await saveHist('hist-mejoras',historialMejoras);await saveHist('hist-indicadores',historialIndicadores);alert('✅ Datos importados correctamente.');go('home');}catch(e){alert('Error: '+e.message);}input.value='';}
function dlBlob(content,filename,type='text/html;charset=utf-8'){const blob=new Blob([content],{type});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=filename;document.body.appendChild(a);a.click();document.body.removeChild(a);}

}

function fmtTime(s){const h=Math.floor(s/3600),m=Math.floor((s%3600)/60),ss=s%60;return h>0?`${h}:${String(m).padStart(2,'0')}:${String(ss).padStart(2,'0')}`:`${String(m).padStart(2,'0')}:${String(ss).padStart(2,'0')}`;}
function fmtDT(iso){if(!iso)return null;const d=new Date(iso);return`${d.getDate()} de ${MESES[d.getMonth()]}, ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;}
function getDT(a,b,c){const d=document.getElementById(a)?.value,h=document.getElementById(b)?.value,m=document.getElementById(c)?.value;return d?`${d}T${String(h).padStart(2,'0')}:${m}:00`:null;}
function gSwitch(tab){['lista','calendario','nueva'].forEach(t=>{const el=document.getElementById('g-'+t);if(el)el.style.display='none';const b=document.getElementById('gtab-'+t);if(b){b.style.background='transparent';b.style.color='#64748b';}});const el=document.getElementById('g-'+tab);if(el)el.style.display='';const b=document.getElementById('gtab-'+tab);if(b){b.style.background='#1A75BB';b.style.color='#fff';}if(tab==='lista')renderTaskList();if(tab==='calendario')renderCal();}
function buildHourSelects(){['fn-hora-i','fn-hora-c','fn-hora-i-v','fn-hora-c-v'].forEach((id,i)=>{const el=document.getElementById(id);if(!el)return;const def=i===1||i===3?17:8;for(let h=0;h<24;h++){const o=document.createElement('option');o.value=h;o.textContent=(h<10?'0':'')+h+':00 '+(h<12?'AM':h===12?'PM':'PM');if(h>=8&&h<=18)o.style.fontWeight='bold';if(h===def)o.selected=true;el.appendChild(o);}});['fn-min-i','fn-min-c','fn-min-i-v','fn-min-c-v'].forEach(id=>{const el=document.getElementById(id);if(!el)return;MINS.forEach(m=>{const o=document.createElement('option');o.value=m;o.textContent=':'+m;el.appendChild(o);});});['fn-fecha-i','fn-fecha-c','fn-fecha-i-v','fn-fecha-c-v'].forEach(id=>{const el=document.getElementById(id);if(el)el.value=todayStr;});}
function buildMonthSelector(){const sel=document.getElementById('rep-mes');if(!sel)return;const n=new Date();for(let i=0;i<12;i++){const d=new Date(n.getFullYear(),n.getMonth()-i,1);const o=document.createElement('option');o.value=`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`;o.textContent=`${MESES[d.getMonth()].charAt(0).toUpperCase()+MESES[d.getMonth()].slice(1)} ${d.getFullYear()}`;if(i===0)o.selected=true;sel.appendChild(o);}}

function calcTiempo(){const ini=getDT('fn-fecha-i','fn-hora-i','fn-min-i');const cF=durMode==='dia'?document.getElementById('fn-fecha-i')?.value:document.getElementById('fn-fecha-c-v')?.value;const cH=durMode==='dia'?document.getElementById('fn-hora-c')?.value:document.getElementById('fn-hora-c-v')?.value;const cM=durMode==='dia'?document.getElementById('fn-min-c')?.value:document.getElementById('fn-min-c-v')?.value;if(!ini||!cF)return;const diff=Math.round((new Date(`${cF}T${String(cH).padStart(2,'0')}:${cM}:00`)-new Date(ini))/60000);const lbl=document.getElementById('fn-tiempo-lbl'),inp=document.getElementById('fn-tiempo');if(diff>0){if(inp)inp.value=diff;const h=Math.floor(diff/60),m=diff%60;if(lbl)lbl.textContent=h>0?(m>0?`${h}h ${m}min`:`${h}h`):`${m} min`;}else{if(inp)inp.value='';if(lbl)lbl.textContent=diff<0?'⚠ Cierre antes del inicio':'';};}

function tryDelete(id){deletingId=(deletingId===id)?null:id;closingId=null;reprogId=null;renderTaskList();}

function renderTaskList(){const list=document.getElementById('task-list');if(!list)return;const fCat=document.getElementById('f-cat')?.value||'',fPri=document.getElementById('f-pri')?.value||'',fEst=document.getElementById('f-est')?.value||'',fVenc=document.getElementById('f-venc')?.value||'';const search=(document.getElementById('searchInput')?.value||'').toLowerCase().trim();let filtered=tasks.filter(t=>{if(fCat&&t.categoria!==fCat)return false;if(fPri&&t.prioridad!==fPri)return false;if(fEst&&t.estado!==fEst)return false;if(fVenc==='vencidas'&&!isVencida(t))return false;if(search&&!t.titulo.toLowerCase().includes(search)&&!(t.desc||'').toLowerCase().includes(search))return false;return true;});filtered.sort((a,b)=>{if(a.estado==='Completada'&&b.estado!=='Completada')return 1;if(b.estado==='Completada'&&a.estado!=='Completada')return-1;if(isVencida(a)&&!isVencida(b))return-1;if(isVencida(b)&&!isVencida(a))return 1;const pa={'Alta':0,'Media':1,'Baja':2};if(pa[a.prioridad]!==pa[b.prioridad])return pa[a.prioridad]-pa[b.prioridad];return new Date(a.inicio||0)-new Date(b.inicio||0);});if(!filtered.length){list.innerHTML=`<div style="text-align:center;padding:32px;color:#94a3b8;font-size:13px">${search?'Sin resultados':'No hay tareas.'}</div>`;return;}const catB={'Coordinación':'background:#E6F1FB;color:#0C447C','Documentos':'background:#EEEDFE;color:#3C3489','Resumen':'background:#E1F5EE;color:#085041','Revisión de Informes':'background:#FAEEDA;color:#633806','Reuniones':'background:#FBEAF0;color:#72243E'};const priB={'Alta':'background:#FCEBEB;color:#A32D2D','Media':'background:#FAEEDA;color:#633806','Baja':'background:#EAF3DE;color:#27500A'};const estB={'Pendiente':'background:#f1f5f9;color:#64748b','En Progreso':'background:#E6F1FB;color:#0C447C','Completada':'background:#EAF3DE;color:#27500A','Bloqueada':'background:#FFF7ED;color:#92400E'};const repH=Array.from({length:24},(_,h)=>`<option value="${h}">${String(h).padStart(2,'0')}:00</option>`).join('');list.innerHT function renderCal(){const grid=document.getElementById('cal-grid');if(!grid)return;const start=new Date();start.setDate(start.getDate()-start.getDay()+1+(calOffset*14));const end=new Date(start);end.setDate(start.getDate()+13);const fmt=d=>`${d.getDate()} ${MESES[d.getMonth()].slice(0,3)}`;const cr=document.getElementById('cal-range');if(cr)cr.textContent=`${fmt(start)} – ${fmt(end)} ${end.getFullYear()}`;const hdrs=['Lun','Mar','Mié','Jue','Vie','Sáb','Dom'];let html=hdrs.map(h=>`<div style="text-align:center;font-size:11px;color:#64748b;padding:4px 0;font-weight:500">${h}</div>`).join('');for(let i=0;i<14;i++){const day=new Date(start);day.setDate(start.getDate()+i);const ymd=day.toISOString().slice(0,10);const isToday=ymd===todayStr;const dt=tasks.filter(t=>t.inicio&&t.inicio.slice(0,10)===ymd);const chips=dt.slice(0,3).map(t=>`<div onclick="highlightTask(${t.id})" style="font-size:10px;padding:2px 5px;border-radius:4px;margin-bottom:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer;background:${t.prioridad==='Alta'?'#FCEBEB':t.prioridad==='Media'?'#FAEEDA':'#EAF3DE'};color:${t.prioridad==='Alta'?'#A32D2D':t.prioridad==='Media'?'#633806':'#27500A'}">${t.titulo}</div>`).join('');const more=dt.length>3?`<div style="font-size:10px;color:#94a3b8">+${dt.length-3} más</div>`:'';html+=`<div style="background:#fff;border:${isToday?'1.5px solid #1A75BB':'1px solid #e2e8f0'};border-radius:8px;min-height:76px;padding:6px"><div style="font-size:12px;font-weight:500;margin-bottom:4px;color:${isToday?'#1A75BB':'#64748b'}">${day.getDate()}</div>${chips}${more}</div>`;}grid.innerHTML=html;}

function generarPDF(){const selEl=document.getElementById('rep-mes');if(!selEl)return;const[yr,mo]=selEl.value.split('-');const mn=MESES[parseInt(mo)-1].charAt(0).toUpperCase()+MESES[parseInt(mo)-1].slice(1);const tm=tasks.filter(t=>{if(!t.inicio)return false;const d=new Date(t.inicio);return d.getFullYear()===parseInt(yr)&&d.getMonth()===parseInt(mo)-1;});const sec=tm.reduce((a,t)=>a+t.elapsed,0),comp=tm.filter(t=>t.estado==='Completada').length,pend=tm.filter(t=>t.estado==='Pendiente').length,prog=tm.filter(t=>t.estado==='En Progreso').length;const cats=[...new Set(tm.map(t=>t.categoria))];const cs=cats.map(c=>{const ct=tm.filter(t=>t.categoria===c);return{cat:c,total:ct.length,comp:ct.filter(t=>t.estado==='Completada').length,tiempo:fmtTime(ct.reduce((a,t)=>a+t.elapsed,0))};});const rb=i=>i%2===0?'#F8FAFC':'#FFF';const html=`<!DOCTYPE html><html lang="es"><head><meta charset="UTF-8"><title>Reporte WASH ${mn} ${yr}</title><style>@page{margin:15mm 12mm}body{font-family:'Segoe UI',Arial,sans-serif;color:#1a1a1a;padding:28px;font-size:13px;line-height:1.5}h1{font-size:20px;font-weight:600;color:#1A75BB;margin-bottom:4px}.meta{color:#64748b;font-size:12px;margin-bottom:14px}.note{background:#eff6ff;border:1px solid #bfdbfe;border-radius:6px;padding:10px 14px;margin-bottom:14px;font-size:12px;color:#1d4ed8}.metrics{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin-bottom:20px}.metric{background:#f0f6fc;border:1px solid #cce0f5;border-radius:8px;padding:12px;text-align:center}.mv{font-size:22px;font-weight:700;color:#1A75BB}.ml{font-size:11px;color:#64748b;margin-top:2px}table{width:100%;border-collapse:collapse;margin-bottom:18px;font-size:12px}th{background:#1A75BB;color:#fff;padding:8px;text-align:left;font-weight:500}td{padding:8px;border-bottom:1px solid #e2e8f0;vertical-align:top}.badge{display:inline-block;padding:2px 8px;border-radius:99px;font-size:11px;font-weight:500}h2{font-size:14px;font-weight:600;color:#1A75BB;margin:18px 0 8px;padding-bottom:4px;border-bottom:1px solid #cce0f5}.footer{margin-top:28px;padding-top:10px;border-top:1px solid #e2e8f0;font-size:11px;color:#94a3b8;display:flex;justify-content:space-between}@media print{.note{display:none}body{padding:0}}</style></head><body><h1>Reporte Mensual — ${mn} ${yr}</h1><div class="meta">Frank Sanchez · WASH · UNICEF · ${new Date().getDate()} de ${MESES[new Date().getMonth()]} ${new Date().getFullYear()}</div><div class="note">Para PDF: <strong>Ctrl+P → Guardar como PDF</strong></div><div class="metrics"><div class="metric"><div class="mv">${tm.length}</div><div class="ml">Total</div></div><div class="metric"><div class="mv" style="color:#16a34a">${comp}</div><div class="ml">Completadas</div></div><div class="metric"><div class="mv" style="color:#1A75BB">${prog}</div><div class="ml">En progreso</div></div><div class="metric"><div class="mv" style="color:#94a3b8">${pend}</div><div class="ml">Pendientes</div></div><div class="metric"><div class="mv" style="font-size:16px">${fmtTime(sec)}</div><div class="ml">Tiempo total</div></div></div><h2>Por categoría</h2><table><thead><tr><th>Categoría</th><th>Tareas</th><th>Completadas</th><th>Tiempo</th></tr></thead><tbody>${cs.map((c,i)=>`<tr style="background:${rb(i)}"><td>${c.cat}</td><td>${c.total}</td><td>${c.comp}</td><td>${c.tiempo}</td></tr>`).join('')}</tbody></table><h2>Detalle</h2><table><thead><tr><th>Título</th><th>Categoría</th><th>Prioridad</th><th>Inicio</th><th>Cierre</th><th>Tiempo</th><th>Estado</th></tr></thead><tbody>${tm.map((t,i)=>`<tr style="background:${rb(i)}"><td>${t.titulo}</td><td>${t.categoria}</td><td><span class="badge" style="${t.prioridad==='Alta'?'background:#FCEBEB;color:#A32D2D':t.prioridad==='Media'?'background:#FAEEDA;color:#633806':'background:#EAF3DE;color:#27500A'}">${t.prioridad}</span></td><td>${t.inicio?fmtDT(t.inicio):'-'}</td><td>${t.cierre?fmtDT(t.cierre):'-'}</td><td>${fmtTime(t.elapsed)}</td><td><span class="badge" style="${t.estado==='Completada'?'background:#EAF3DE;color:#27500A':t.estado==='En Progreso'?'background:#E6F1FB;color:#0C447C':'background:#f1f5f9;color:#64748b'}">${t.estado}</span></td></tr>`).join('')}</tbody></table><div class="footer"><span>Frank Sanchez · WASH · UNICEF</span><span>${mn} ${yr}</span></div></body></html>`;dlBlob(html,`Reporte_WASH_${mn}_${yr}.html`);}

async function handleDocFile(file){if(!file)return;const ext=file.name.split('.').pop().toLowerCase();docFile=file.name;document.getElementById('dz-title').textContent=file.name;document.getElementById('dz-sub').textContent='Leyendo...';document.getElementById('doc-meta').style.display='none';try{let t='';if(ext==='txt'){t=await file.text();}else if(ext==='pdf'){pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';const pdf=await pdfjsLib.getDocument({data:await file.arrayBuffer()}).promise;for(let i=1;i<=Math.min(pdf.numPages,90);i++){const pg=await pdf.getPage(i);const c=await pg.getTextContent();t+='\n[Página '+i+']\n'+c.items.map(s=>s.str).join(' ')+'\n';if(t.length>MAX_DOC)break;}}else if(ext==='docx'||ext==='doc'){t=(await mammoth.extractRawText({arrayBuffer:await file.arrayBuffer()})).value;}else if(ext==='pptx'){const zip=await JSZip.loadAsync(await file.arrayBuffer());const slides=Object.keys(zip.files).filter(n=>n.match(/ppt\/slides\/slide\d+\.xml$/)).sort((a,b)=>+a.match(/\d+/)[0]-+b.match(/\d+/)[0]);for(let i=0;i<slides.length;i++){const xml=await zip.files[slides[i]].async('string');t+='\n[Diapositiva '+(i+1)+']\n'+xml.replace(/<[^>]+>/g,' ').replace(/\s+/g,' ').trim()+'\n';if(t.length>MAX_DOC)break;}}else{t=await file.text();}if(t.length>MAX_DOC)t=t.slice(0,MAX_DOC);docText=t;const pages=Math.round(t.length/1800);document.getElementById('dz-sub').textContent=(file.size/1024).toFixed(0)+' KB · ~'+pages+' págs.';document.getElementById('doc-meta').style.display='block';document.getElementById('doc-meta').textContent='✓ '+t.length.toLocaleString()+' caracteres';const btn=document.getElementById('analyze-btn');btn.disabled=false;btn.style.background='linear-gradient(135deg,#1A75BB,#155f98)';btn.style.color='#fff';btn.style.cursor='pointer';btn.textContent='Analizar (~'+pages+' págs.)';}catch(e){document.getElementById('dz-sub').textContent='Error: '+e.message;}}
function docLog(msg,c='#16a34a'){const b=document.getElementById('log-box');if(!b)return;const d=document.createElement('div');d.style.color=c;d.textContent='› '+msg;b.appendChild(d);b.scrollTop=b.scrollHeight;}

function startDocAnalysis(){if(!docText)return;const btn=document.getElementById('analyze-btn');btn.disabled=true;btn.textContent='Analizando...';btn.style.background='#cbd5e1';btn.style.color='#94a3b8';findings=[];document.getElementById('doc-results').style.display='none';document.getElementById('doc-progress').style.display='block';document.getElementById('log-box').innerHTML='';document.getElementById('paste-area').style.display='none';docProg(20,'Preparando...');docLog('Archivo: '+docFile);const dinstr={rapido:'Solo errores críticos. Máximo 10.',estandar:'Análisis completo. Hasta 25.',profundo:'Análisis exhaustivo.'}[docDepth];const prompt=`Analiza este documento. Detecta contradicciones cruzadas. Responde ÚNICAMENTE con JSON:\n{"hallazgos":[{"severidad":"critico|advertencia|sugerencia","categoria":"Contradicción|Datos|Formato|Coherencia|Objetivos|Ortografía","titulo":"","descripcion":"","ubicacion":"","texto_conflicto_a":"","texto_conflicto_b":"","sugerencia_mejora":""}]}\nÁreas: ${docChecks.join(', ')} · ${dinstr}\nDOCUMENTO:\n${docText}`;docProg(60,'Enviando...');try{if(typeof sendPrompt==='function'){sendPrompt(prompt);docProg(80,'Enviado');docLog('✓ Enviado a Claude');}else throw new Error('no');}catch(e){navigator.clipboard.writeText(prompt).then(()=>{docLog('✓ Copiado','#f59e0b');}).catch(()=>{});}docLog('Pega el JSON abajo','#f59e0b');document.getElementById('paste-area').style.display='block';btn.disabled=false;btn.style.background='linear-gradient(135deg,#1A75BB,#155f98)';btn.style.color='#fff';btn.style.cursor='pointer';btn.textContent='Volver a analizar';}
function loadDocJSON(){const raw=document.getElementById('json-input')?.value.trim();if(!raw){alert('Pega el JSON primero.');return;}let parsed;try{const m=raw.replace(/```json|```/g,'').trim().match(/\{[\s\S]*\}/);parsed=JSON.parse(m?m[0]:raw);}catch(e){alert('JSON inválido.');return;}findings=(parsed.hallazgos||[]).map((f,i)=>({...f,_id:i}));if(!findings.length){alert('Sin hallazgos.');return;}docProg(100,'¡Completado!');docLog('✓ '+findings.length+' hallazgos','#16a34a');document.getElementById('paste-area').style.display='none';guardarReporte();setTimeout(showDocResults,300);}
async function guardarReporte(){const crit=findings.filter(f=>f.severidad==='critico').length,warn=findings.filter(f=>f.severidad==='advertencia').length,sug=findings.filter(f=>f.severidad==='sugerencia').length;historialReportes.unshift({archivo:docFile,crit,warn,sug,total:findings.length,findings,ts:Date.now()});await saveHist('hist-reportes',historialReportes);}
function showDocResults(){const crit=findings.filter(f=>f.severidad==='critico').length,warn=findings.filter(f=>f.severidad==='advertencia').length,sug=findings.filter(f=>f.severidad==='sugerencia').length;document.getElementById('doc-stats').innerHTML=[{n:crit,l:'Críticos',c:'#dc2626',bg:'#fef2f2'},{n:warn,l:'Advertencias',c:'#d97706',bg:'#fffbeb'},{n:sug,l:'Sugerencias',c:'#16a34a',bg:'#f0fdf4'},{n:findings.length,l:'Total',c:'#1A75BB',bg:'#eff6ff'}].map(s=>`<div style="background:${s.bg};border:1px solid #e2e8f0;border-radius:11px;padding:14px;text-align:center"><div style="font-size:26px;font-weight:600;color:${s.c};font-family:monospace">${s.n}</div><div style="font-size:10px;color:#64748b;margin-top:3px">${s.l}</div></div>`).join('');docFilter='todos';document.getElementById('doc-filters').innerHTML=[{f:'todos',l:'Todos'},{f:'critico',l:'🔴 Críticos'},{f:'advertencia',l:'🟡 Advertencias'},{f:'sugerencia',l:'🟢 Sugerencias'}].map(t=>`<button onclick="setDocFilter('${t.f}',this)" style="padding:5px 13px;border-radius:99px;font-size:12px;font-weight:500;border:1px solid ${t.f==='todos'?'#1A75BB':'#e2e8f0'};background:${t.f==='todos'?'#1A75BB':'#fff'};color:${t.f==='todos'?'#fff':'#64748b'};cursor:pointer">${t.l}</button>`).join('');renderDocFindings();document.getElementById('doc-progress').style.display='none';document.getElementById('doc-results').style.display='block';document.getElementById('export-btn').style.display='inline-block';}
function setDocFilter(f,el){docFilter=f;document.querySelectorAll('#doc-filters button').forEach(b=>{const on=b===el;b.style.background=on?'#1A75BB':'#fff';b.style.color=on?'#fff':'#64748b';b.style.borderColor=on?'#1A75BB':'#e2e8f0';});renderDocFindings();}
function renderDocFindings(){const list=document.getElementById('doc-findings');const data=docFilter==='todos'?findings:findings.filter(f=>f.severidad===docFilter);if(!data.length){list.innerHTML='<p style="text-align:center;color:#94a3b8;padding:28px;font-size:13px">Sin hallazgos</p>';return;}list.innerHTML=data.map(f=>{const sc=f.severidad==='critico'?'#dc2626':f.severidad==='advertencia'?'#d97706':'#16a34a';const sb=f.severidad==='critico'?'#fef2f2':f.severidad==='advertencia'?'#fffbeb':'#f0fdf4';const sl=f.severidad==='critico'?'🔴 Crítico':f.severidad==='advertencia'?'🟡 Advertencia':'🟢 Sugerencia';return`<div style="background:#fff;border:1px solid #e2e8f0;border-radius:11px;padding:14px;margin-bottom:8px;cursor:pointer" onclick="this.querySelector('.fbody').style.display=this.querySelector('.fbody').style.display==='block'?'none':'block';this.querySelector('.arr').textContent=this.querySelector('.fbody').style.display==='block'?'▲':'▼'"><div style="display:flex;align-items:flex-start;gap:7px;flex-wrap:wrap"><span style="padding:2px 8px;border-radius:99px;font-size:11px;font-weight:600;background:${sb};color:${sc};white-space:nowrap">${sl}</span><span style="font-size:11px;color:#64748b;background:#f1f5f9;border-radius:99px;padding:2px 8px">${f.categoria||''}</span><span style="font-size:13px;font-weight:500;flex:1;line-height:1.4;color:#1e293b">${f.titulo||''}</span><span class="arr" style="font-size:11px;color:#94a3b8">▼</span></div><div class="fbody" style="display:none;margin-top:10px;font-size:12px;color:#64748b;line-height:1.65">${f.descripcion?`<p style="margin-bottom:5px">${f.descripcion}</p>`:''}${f.ubicacion?`<p style="font-size:11px;color:#1A75BB;margin-bottom:6px">📍 ${f.ubicacion}</p>`:''}${f.texto_conflicto_a?`<div style="margin-top:6px;padding:7px 10px;background:#f8fafc;border-radius:6px;border-left:2px solid #dc2626"><div style="font-size:10px;color:#94a3b8;margin-bottom:2px">⚠ Texto A</div>${f.texto_conflicto_a}</div>`:''}${f.texto_conflicto_b?` function exportDocReport(){if(!findings.length){alert('Sin hallazgos.');return;}const rows=findings.map((f,i)=>{const sc=f.severidad==='critico'?'#dc2626':f.severidad==='advertencia'?'#d97706':'#16a34a';return`<tr style="background:${i%2?'#f8fafc':'#fff'}"><td style="padding:9px 8px;font-weight:700;color:${sc}">${f.severidad==='critico'?'🔴 Crítico':f.severidad==='advertencia'?'🟡 Advertencia':'🟢 Sugerencia'}</td><td style="padding:9px 8px;font-size:11px;color:#64748b">${f.categoria||''}</td><td style="padding:9px 8px;font-weight:600">${f.titulo||''}</td><td style="padding:9px 8px;font-size:12px">${f.descripcion||''}</td><td style="padding:9px 8px;font-size:11px;color:#1A75BB">${f.ubicacion||''}</td><td style="padding:9px 8px;font-size:11px;color:#16a34a">${f.sugerencia_mejora||''}</td></tr>`}).join('');const html=`<!DOCTYPE html><html lang="es"><head><meta charset="UTF-8"><title>Reporte revisión</title><style>body{font-family:Arial,sans-serif;color:#1e293b;font-size:13px;padding:28px}h1{font-size:22px;font-weight:700;margin:0 0 4px}.note{background:#eff6ff;border:1px solid #bfdbfe;border-radius:6px;padding:10px;margin-bottom:14px;font-size:12px;color:#1d4ed8}table{width:100%;border-collapse:collapse}th{background:#1e293b;color:#f1f5f9;padding:9px 8px;text-align:left;font-size:11px}td{border-bottom:1px solid #e2e8f0;vertical-align:top}@media print{.note{display:none}}</style></head><body><h1>Reporte de revisión</h1><div style="color:#64748b;font-size:12px;margin-bottom:14px">Archivo: <strong>${docFile}</strong> · ${new Date().toLocaleString('es-PE')}</div><div class="note">Para PDF: <strong>Ctrl+P → Guardar como PDF</strong></div><table><thead><tr><th>Severidad</th><th>Categoría</th><th>Título</th><th>Descripción</th><th>Ubicación</th><th>Sugerencia</th></tr></thead><tbody>${rows}</tbody></table></body></html>`;dlBlob(html,'reporte_'+docFile.replace(/\.[^.]+$/,'')+'.html');}

function loadTranslation(){const t=document.getElementById('trad-paste-input')?.value.trim();if(!t){alert('Pega la traducción primero.');return;}const original=document.getElementById('txt-origen')?.value.trim()||'';const res=document.getElementById('txt-resultado');if(res)res.textContent=t;const pa=document.getElementById('trad-paste');if(pa)pa.style.display='none';const inp=document.getElementById('trad-paste-input');if(inp)inp.value='';guardarTraduccion(original,t);}
async function guardarTraduccion(original,traduccion){historialTraducciones.unshift({original,traduccion,dir:tradDir,ts:Date.now()});await saveHist('hist-traducciones',historialTraducciones);}
function filterGlos(cat,btn){activeGlos=cat;if(btn){document.querySelectorAll('.gf').forEach(b=>{b.style.background=b===btn?'#1A75BB':'#fff';b.style.color=b===btn?'#fff':'#64748b';b.style.borderColor=b===btn?'#1A75BB':'#e2e8f0';});}const search=(document.getElementById('glos-search')?.value||'').toLowerCase().trim();const filtered=GLOSARIO.filter(g=>{const mc=cat==='todos'||g.cat===cat;const ms=!search||g.es.toLowerCase().includes(search)||g.en.toLowerCase().includes(search);return mc&&ms;});const catColors={'WASH':'background:#E6F1FB;color:#0C447C','ONU':'background:#EEEDFE;color:#3C3489','Humanitario':'background:#FAEEDA;color:#633806','Técnico':'background:#EAF3DE;color:#27500A'};const body=document.getElementById('glos-body');if(!body)return;body.innerHTML=filtered.map((g,i)=>`<tr style="background:${i%2===0?'#fff':'#f8fafc'}"><td style="padding:7px 10px;border-bottom:1px solid #f1f5f9;font-size:12px;cursor:pointer;color:#1e293b" onclick="insertTerm('${g.es.replace(/'/g,"\\'")}')">${g.es}</td><td style="padding:7px 10px;border-bottom:1px solid #f1f5f9;font-size:12px;cursor:pointer;color:#1e293b" onclick="insertTerm('${g.en.replace(/'/g,"\\'")}')">${g.en}</td><td style="padding:7px 10px;border-bottom:1px solid #f1f5f9"><span style="font-size:10px;padding:2px 7px;border-radius:99px;font-weight:500;${catColors[g.cat]||''}">${g.cat}</span></td></tr>`).join('')||'<tr><td colspan="3" style="padding:14px;text-align:center;color:#94a3b8;font-size:12px">Sin términos</td></tr>';}
function insertTerm(term){const ta=document.getElementById('txt-origen');if(!ta)return;const pos=ta.selectionStart,v=ta.value;ta.value=v.slice(0,pos)+term+v.slice(pos);ta.focus();ta.setSelectionRange(pos+term.length,pos+term.length);}

// Reuniones
function setMeetMode(m){meetMode=m;['texto','doc','notas','audio'].forEach(x=>{const p=document.getElementById('mpanel-'+x),b=document.getElementById('mmode-'+x);if(p)p.style.display=x===m?'':'none';if(b){b.style.background=x===m?'#14b8a6':'transparent';b.style.color=x===m?'#fff':'#64748b';}});}
const MAX_MEET=120000;
async function handleMeetDoc(file){if(!file)return;const ext=file.name.split('.').pop().toLowerCase();document.getElementById('meet-doc-name').textContent=file.name;document.getElementById('meet-doc-info').textContent='Leyendo...';try{let t='';if(ext==='txt')t=await file.text();else if(ext==='pdf'){pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';const pdf=await pdfjsLib.getDocument({data:await file.arrayBuffer()}).promise;for(let i=1;i<=Math.min(pdf.numPages,60);i++){const pg=await pdf.getPage(i);const c=await pg.getTextContent();t+=c.items.map(s=>s.str).join(' ')+'\n';if(t.length>MAX_MEET)break;}}else if(ext==='docx'||ext==='doc')t=(await mammoth.extractRawText({arrayBuffer:await file.arrayBuffer()})).value;if(t.length>MAX_MEET)t=t.slice(0,MAX_MEET);meetDocText=t;document.getElementById('meet-doc-info').textContent=(file.size/1024).toFixed(0)+' KB';const ok=document.getElementById('meet-doc-ok');if(ok){ok.style.display='block';ok.textContent='✓ Listo';}}catch(e){document.getElementById('meet-doc-info').textContent='Error: '+e.message;}}
function toggleMic(){if(!('webkitSpeechRecognition' in window||'SpeechRecognition' in window)){alert('Usa Chrome para dictar.');return;}if(micActive){if(recognition)recognition.stop();micActive=false;const b=document.getElementById('mic-btn');if(b)b.style.background='#14b8a6';return;}const SR=window.SpeechRecognition||window.webkitSpeechRecognition;recognition=new SR();recognition.lang='es-PE';recognition.continuous=true;recognition.interimResults=true;recognition.onstart=()=>{micActive=true;const b=document.getElementById('mic-btn');if(b)b.style.background='#dc2626';};recognition.onresult=(e)=>{let final='';for(let i=e.resultIndex;i<e.results.length;i++){if(e.results[i].isFinal)final+=e.results[i][0].transcript;}const ta=document.getElementById('txt-audio');if(final&&ta)ta.value+=final+' ';};recognition.onend=()=>{micActive=false;const b=document.getElementById('mic-btn');if(b)b.style.background='#14b8a6';};recognition.start();}
function getMeetContent(){if(meetMode==='texto')return document.getElementById('txt-meet')?.value.trim()||'';if(meetMode==='doc')return meetDocText.trim();if(meetMode==='notas')return document.getElementById('txt-notas')?.value.trim()||'';if(meetMode==='audio')return document.getElementById('txt-audio')?.value.trim()||'';return '';}
function meetLog(msg,c='#16a34a'){const b=document.getElementById('meet-log');if(!b)return;const d=document.createElement('div');d.style.color=c;d.textContent='› '+msg;b.appendChild(d);b.scrollTop=b.scrollHeight;}
function meetProg(p,l){const bar=document.getElementById('meet-prog-bar'),lbl=document.getElementById('meet-prog-label');if(bar)bar.style.width=p+'%';if(lbl)lbl.textContent=l;}
function genResumen(){const titulo=document.getElementById('r-titulo')?.value.trim();if(!titulo){alert('Escribe el título.');return;}const contenido=getMeetContent();if(!contenido){alert('Agrega el contenido.');return;}const fecha=document.getElementById('r-fecha')?.value||'';const tipo=document.getElementById('r-tipo')?.value||'';const lugar=document.getElementById('r-lugar')?.value||'';const idioma=document.getElementById('r-idioma')?.value||'es';document.getElementById('meet-prog').style.display='block';document.getElementById('meet-result').style.display='none';document.getElementById('meet-log').innerHTML='';document.getElementById('meet-paste').style.display='none';meetProg(20,'Preparando...');meetLog('Reunión: '+titulo);const idiomaInstr=idioma==='en'?'Respond entirely in English.':idioma==='ambos'?'Provide full summary first in Spanish, then in English.':'Responde en español.';const prompt=`Genera un resumen ejecutivo profesional.\n\nDATOS:\n- Título: ${titulo}\n- Fecha: ${fecha}\n- Tipo: ${tipo}\n- Lugar: ${lugar}\n\nSECCIONES:\n1. ACUERDOS Y COMPROMISOS\n2. RESPONSABLES Y FECHAS\n3. PRÓXIMOS PASOS\n\nAl final:\n===TAREAS PARA GESTOR===\nTAREA: [descripción] | RESPONSABLE: [nombre] | FECHA: [fecha]\n===FIN TAREAS===\n\n${idiomaInstr}\n\nCONTENIDO:\n${contenido}`;meetProg(60,'Enviando...');try{if(typeof sendPrompt==='function'){sendPrompt(prompt);meetProg(80,'Enviado');meetLog('✓ Enviado');}else throw new Error('no');}catch(e){navigator.clipboard.writeText(prompt).then(()=>{meetLog('✓ Copiado','#f59e0b');}).catch(()=>{});}meetLog('Pega el resumen abajo','#f59e0b');document.getElementById('meet-paste').style.display='block';}
function loadMeetResumen(){const texto=document.getElementById('meet-resumen-input')?.value.trim();if(!texto){alert('Pega el resumen primero.');return;}resumenTexto=texto;const display=texto.replace(/===TAREAS PARA GESTOR===[\s\S]*?===FIN TAREAS===/g,'').trim();document.getElementById('meet-display').textContent=display;extraerTareasReunion(texto);guardarResumen();document.getElementById('meet-prog').style.display='none';document.getElementById('meet-result').style.display='block';meetProg(100,'¡Listo!');}
async function guardarResumen(){const titulo=document.getElementById('r-titulo')?.value.trim()||'Sin título';const fecha=document.getElementById('r-fecha')?.value||'';const tipo=document.getElementById('r-tipo')?.value||'';const lugar=document.getElementById('r-lugar')?.value||'';const display=resumenTexto.replace(/===TAREAS PARA GESTOR===[\s\S]*?===FIN TAREAS===/g,'').trim();historialReuniones.unshift({titulo,fecha,tipo,lugar,contenido:display,ts:Date.now()});await saveHist('hist-reuniones',historialReuniones);}
function extraerTareasReunion(texto){tareasExtraidas=[];const match=texto.match(/===TAREAS PARA GESTOR===([\s\S]*?)===FIN TAREAS===/);if(!match)return;const lineas=match[1].trim().split('\n');for(const linea of lineas){if(!linea.includes('TAREA:'))continue;const p=linea.split('|');const tarea=p[0]?.replace('TAREA:','').trim()||'';const resp=p[1]?.replace('RESPONSABLE:','').trim()||'';const fecha=p[2]?.replace('FECHA:','').trim()||'';if(tarea)tareasExtraidas.push({tarea,resp,fecha});}if(!tareasExtraidas.length)return;document.getElementById('tareas-box').style.display='block';document.getElementById('tareas-list').innerHTML=tareasExtraidas.map((t,i)=>`<div style="background:#f8fafc;border:1px solid #e2e8f0;border-radius:8px;padding:12px;display:flex;align-items:flex-start;gap:12px"><input type="checkbox" checked id="tc-${i}" style="margin-top:2px;accent-color:#14b8a6;width:16px;height:16px;flex-shrink:0"><div style="flex:1"><div style="font-size:13px;font-weight:500;margin-bottom:4px">${t.tarea}</div><div style="display:flex;gap:8px;flex-wrap:wrap">${t.resp?`<span style="font-size:11px;background:#E6F1FB;color:#0C447C;border-radius:99px;padding:2px 8px">👤 ${t.resp}</span>`:''}${t.fecha&&t.fecha!=='No especificada'?`<span style="font-size:11px;background:#FAEEDA;color:#633806;border-radius:99px;padding:2px 8px">📅 ${t.fecha}</span>`:''}</div></div></div>`).join('');}
function enviarTareas(){const sel=tareasExtraidas.filter((_,i)=>document.getElementById('tc-'+i)?.checked);if(!sel.length){alert('Selecciona al menos una tarea.');return;}const titulo=document.getElementById('r-titulo')?.value||'reunión';const prompt=`Agrega estas tareas al Gestor con categoría "Reuniones", de "${titulo}":\n\n${sel.map((t,i)=>`${i+1}. ${t.tarea}${t.resp?' — Responsable: '+t.resp:''}${t.fecha&&t.fecha!=='No especificada'?' — Fecha: '+t.fecha:''}`).join('\n')}\n\nConfírmame.`;try{if(typeof sendPrompt==='function')sendPrompt(prompt);}catch(e){}alert('Solicitud enviada.');}
function exportMeetResumen(){if(!resumenTexto){alert('Genera el resumen primero.');return;}const titulo=document.getElementById('r-titulo')?.value||'Reunión';const fecha=document.getElementById('r-fecha')?.value||todayStr;const tipo=document.getElementById('r-tipo')?.value||'';const lugar=document.getElementById('r-lugar')?.value||'';const display=resumenTexto.replace(/===TAREAS PARA GESTOR===[\s\S]*?===FIN TAREAS===/g,'').trim();const html=`<!DOCTYPE html><html lang="es"><head><meta charset="UTF-8"><title>Acta — ${titulo}</title><style>@page{margin:20mm 15mm}body{font-family:'Segoe UI',Arial,sans-serif;color:#1e293b;padding:32px;font-size:13px;line-height:1.6}h1{font-size:20px;font-weight:600;color:#0d9488;margin-bottom:4px}.meta{color:#64748b;font-size:12px;margin-bottom:14px}.note{background:#eff6ff;border:1px solid #bfdbfe;border-radius:6px;padding:10px;margin-bottom:16px;font-size:12px;color:#1d4ed8}.content{white-space:pre-wrap;font-size:13px;line-height:1.8;background:#f8fafc;border-radius:8px;padding:18px;border:1px solid #e2e8f0}.footer{margin-top:28px;padding-top:10px;border-top:1px solid #e2e8f0;font-size:11px;color:#94a3b8;display:flex;justify-content:space-between}@media print{.note{display:none}}</style></head><body><h1>${titulo}</h1><div class="meta">${tipo} · ${lugar} · ${fecha} · UNICEF Tumbes · WASH</div><div class="note">Para PDF: <strong>Ctrl+P → Guardar como PDF</strong></div><div class="content">${display}</div><div class="footer"><span>Frank Sanchez · WASH · UNICEF Tumbes</span><span>${fecha}</span></div></body></html>`;dlBlob(html,'Acta_'+titulo.replace(/\s+/g,'_').slice(0,40)+'_'+fecha+'.html');}

function setMejInput(m){mejInputMode=m;['texto','doc'].forEach(x=>{const p=document.getElementById('mpanel-'+x+'-mej'),b=document.getElementById('minput-'+x);if(p)p.style.display=x===m?'':'none';if(b){b.style.background=x===m?'#8b5cf6':'transparent';b.style.color=x===m?'#fff':'#64748b';}});}
function setMejStyle(el){document.querySelectorAll('.mej-style').forEach(c=>{c.style.border='1.5px solid #e2e8f0';c.style.background='#fff';});el.style.border='2px solid #8b5cf6';el.style.background='rgba(139,92,246,.05)';mejoradorStyle=el.dataset.v;}
async function mejPaste(){try{const t=await navigator.clipboard.readText();const el=document.getElementById('mej-txt');if(el){el.value=t;document.getElementById('mej-chars').textContent=t.length.toLocaleString()+' caracteres';}}catch(e){alert('Pega manualmente con Ctrl+V.');}}
const MAX_MEJ=120000;
async function handleMejDoc(file){if(!file)return;const ext=file.name.split('.').pop().toLowerCase();document.getElementById('mej-doc-name').textContent=file.name;document.getElementById('mej-doc-info').textContent='Leyendo...';try{let t='';if(ext==='txt')t=await file.text();else if(ext==='pdf'){pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';const pdf=await pdfjsLib.getDocument({data:await file.arrayBuffer()}).promise;for(let i=1;i<=Math.min(pdf.numPages,60);i++){const pg=await pdf.getPage(i);const c=await pg.getTextContent();t+=c.items.map(s=>s.str).join(' ')+'\n';if(t.length>MAX_MEJ)break;}}else if(ext==='docx'||ext==='doc')t=(await mammoth.extractRawText({arrayBuffer:await file.arrayBuffer()})).value;else if(ext==='pptx'){const zip=await JSZip.loadAsync(await file.arrayBuffer());const slides=Object.keys(zip.files).filter(n=>n.match(/ppt\/slides\/slide\d+\.xml$/)).sort((a,b)=>+a.match(/\d+/)[0]-+b.match(/\d+/)[0]);for(let i=0;i<slides.length;i++){const xml=await zip.files[slides[i]].async('string');t+=xml.replace(/<[^>]+>/g,' ').replace(/\s+/g,' ').trim()+'\n';if(t.length>MAX_MEJ)break;}}if(t.length>MAX_MEJ)t=t.slice(0,MAX_MEJ);mejDocTexto=t;document.getElementById('mej-doc-info').textContent=(file.size/1024).toFixed(0)+' KB · '+t.length.toLocaleString()+' chars';const ok=document.getElementById('mej-doc-ok');if(ok){ok.style.display='block';ok.textContent='✓ Listo';}}catch(e){document.getElementById('mej-doc-info').textContent='Error: '+e.message;}}
function mejLog(msg,c='#16a34a'){const b=document.getElementById('mej-log');if(!b)return;const d=document.createElement('div');d.style.color=c;d.textContent='› '+msg;b.appendChild(d);b.scrollTop=b.scrollHeight;}
function mejProg(p,l){const bar=document.getElementById('mej-prog-bar'),lbl=document.getElementById('mej-prog-label');if(bar)bar.style.width=p+'%';if(lbl)lbl.textContent=l;}
function ejecutarMejora(){const texto=mejInputMode==='texto'?document.getElementById('mej-txt')?.value.trim():mejDocTexto.trim();if(!texto||texto.length<20){alert('Agrega el texto a mejorar.');return;}mejoradorTextoOriginal=texto;const estilo=ESTILOS[mejoradorStyle];const explicar=document.getElementById('mej-chk-exp')?.checked;const mantener=document.getElementById('mej-chk-struct')?.checked;document.getElementById('mej-prog').style.display='block';document.getElementById('mej-result').style.display='none';document.getElementById('mej-log').innerHTML='';document.getElementById('mej-paste').style.display='none';mejProg(20,'Preparando...');mejLog('Estilo: '+estilo.label);mejLog('Texto: '+texto.length.toLocaleString()+' chars');const prompt=`Eres un experto en redacción institucional (UNICEF, ONU, humanitarismo).\n\nMejora el siguiente texto aplicando el estilo indicado.\n\nESTILO: ${estilo.label}\nINSTRUCCIÓN: ${estilo.instr}\n${mantener?'Mantén la estructura original.':''}\n\nREGLAS:\n- No cambies datos, cifras ni hechos\n- Mejora redacción, fluidez y coherencia\n- Asegura buena hilación entre párrafos\n\n${explicar?`FORMATO:\n===TEXTO MEJORADO===\n[texto mejorado]\n===FIN TEXTO===\n\n===CAMBIOS REALIZADOS===\n[4-6 puntos concretos de cambios]\n===FIN CAMBIOS===`:'Responde ÚNICAMENTE con el texto mejorado.'}\n\nTEXTO:\n${texto}`;mejProg(60,'Enviando...');try{if(typeof sendPrompt==='function'){sendPrompt(prompt);mejProg(80,'Enviado');mejLog('✓ Enviado');}else throw new Error('no');}catch(e){navigator.clipboard.writeText(prompt).then(()=>{mejProg(80,'Copiado');mejLog('✓ Copiado','#f59e0b');}).catch(()=>{});}mejLog('Pega la respuesta abajo','#f59e0b');document.getElementById('mej-paste').style.display='block';}
function cargarMejora(){const raw=document.getElementById('mej-input')?.value.trim();if(!raw){alert('Pega la respuesta primero.');return;}const explicar=document.getElementById('mej-chk-exp')?.checked;if(explicar){const mt=raw.match(/===TEXTO MEJORADO===([\s\S]*?)===FIN TEXTO===/);const mc=raw.match(/===CAMBIOS REALIZADOS===([\s\S]*?)===FIN CAMBIOS===/);mejoradorTextMejorado=mt?mt[1].trim():raw;mejoradorExplicacion=mc?mc[1].trim():'';}else{mejoradorTextMejorado=raw;mejoradorExplicacion='';}document.getElementById('mpanel-mejorado').textContent=mejoradorTextMejorado;document.getElementById('mpanel-original').textContent=mejoradorTextoOriginal;document.getElementById('mpanel-cambios').textContent=mejoradorExplicacion||'No se solicitó explicación.';mejProg(100,'¡Listo!');document.getElementById('mej-paste').style.display='none';document.getElementById('mej-prog').style.display='none';document.getElementById('mej-result').style.display='block';guardarMejora();}
async function guardarMejora(){const estilo=ESTILOS[mejoradorStyle];historialMejoras.unshift({estilo:estilo.label,original:mejoradorTextoOriginal.slice(0,200),mejorado:mejoradorTextMejorado,explicacion:mejoradorExplicacion,ts:Date.now()});await saveHist('hist-mejoras',historialMejoras);}
function mejTab(tab,btn){['mejorado','original','cambios'].forEach(t=>{const p=document.getElementById('mpanel-'+t);if(p)p.style.display='none';const b=document.getElementById('mtab-'+t);if(b){b.style.background='transparent';b.style.color='#64748b';}});const p=document.getElementById('mpanel-'+tab);if(p)p.style.display='block';if(btn){btn.style.background='#8b5cf6';btn.style.color='#fff';}}
function copiarMejora(){if(!mejoradorTextMejorado){alert('Sin texto.');return;}navigator.clipboard.writeText(mejoradorTextMejorado).then(()=>alert('✓ Copiado')).catch(()=>alert('Selecciona manualmente.'));}
function exportarMejora(){if(!mejoradorTextMejorado){alert('Sin texto.');return;}const estilo=ESTILOS[mejoradorStyle];const html=`<!DOCTYPE html><html lang="es"><head><meta charset="UTF-8"><title>Texto mejorado</title><style>@page{margin:20mm 15mm}body{font-family:'Segoe UI',Arial,sans-serif;color:#1e293b;padding:32px;font-size:13px;line-height:1.8}h1{font-size:20px;font-weight:600;color:#6d28d9;margin-bottom:4px}.meta{color:#64748b;font-size:12px;margin-bottom:14px}.note{background:#eff6ff;border:1px solid #bfdbfe;border-radius:6px;padding:10px;margin-bottom:16px;font-size:12px;color:#1d4ed8}.badge{display:inline-block;background:#f5f3ff;color:#6d28d9;border:1px solid #ddd6fe;border-radius:99px;padding:3px 10px;font-size:11px;margin-bottom:14px}.st{font-size:13px;font-weight:600;color:#475569;margin:18px 0 8px;padding-bottom:4px;border-bottom:1px solid #e2e8f0}.content-mej{white-space:pre-wrap;background:#faf5ff;border-radius:8px;padding:16px;border:1px solid #e9d5ff;line-height:1.85}.content-cambios{white-space:pre-wrap;background:#fffbeb;border-radius:8px;padding:14px;border:1px solid #fde68a;font-size:12px;line-height:1.7}.content-orig{white-space:pre-wrap;background:#f8fafc;border-radius:8px;padding:14px;border:1px solid #e2e8f0;font-size:12px;color:#64748b;line-height:1.7}.footer{margin-top:28px;padding-top:10px;border-top:1px solid #e2e8f0;font-size:11px;color:#94a3b8;display:flex;justify-content:space-between}@media print{.note{display:none}}</style></head><body><h1>Texto mejorado</h1><div class="meta">Frank Sanchez · WASH · UNICEF Tumbes · ${new Date().toLocaleString('es-PE')}</div><div class="note">Para PDF: <strong>Ctrl+P → Guardar como PDF</strong></div><span class="badge">${estilo.icon} ${estilo.label} — ${estilo.sub}</span><div class="st">✨ Texto mejorado</div><div class="content-mej">${mejoradorTextMejorado}</div>${mejoradorExplicacion?`<div class="st">💡 Cambios realizados</div><div class="content-cambios">${mejoradorExplicacion}</div>`:''}<div class="st">📄 Texto original</div><div class="content-orig">${mejoradorTextoOriginal}</div><div class="footer"><span>Frank Sanchez · WASH · UNICEF Tumbes</span><span>${new Date().toLocaleDateString('es-PE')}</span></div></body></html>`;dlBlob(html,'texto_mejorado_'+mejoradorStyle+'_'+todayStr+'.html');}

  <div id="modalContent" style="
  width:min(96vw,1280px);
  height:min(92vh,920px);
  background:#f8fafc;
  border:1px solid rgba(226,232,240,.9);
  border-radius:22px;
  padding:10px;
  overflow:hidden;
  position:relative;
  box-shadow:0 28px 90px rgba(15,23,42,.38);
  ">

    <button onclick="closeModal()" style="
    position:absolute;
    top:18px;
    right:18px;
    z-index:2;
    border:none;
    background:rgba(239,68,68,.94);
    color:white;
    padding:7px 12px;
    border-radius:999px;
    box-shadow:0 10px 28px rgba(15,23,42,.22);
    cursor:pointer;
    ">
      Cerrar
    </button>

    <div id="modalBody"></div>

  </div>

</div>

<script>
let modalCloseTimer=null;
function openTool(tool){

  const modal=document.getElementById('modal');
  const body=document.getElementById('modalBody');
  if(modalCloseTimer){clearTimeout(modalCloseTimer);modalCloseTimer=null;}
  const selected=MODULE_BY_ID[tool];

  if(!selected)return;

  if(!selected.path)return;

  const url=new URL(resolveAppPath(selected.path));
  url.searchParams.set('embedded','1');

  body.innerHTML=`
    <iframe
      src="${url.href}"
      title="${selected.name}"
      class="tool-frame"
    ></iframe>
  `;
  modal.style.display='flex';
  requestAnimationFrame(()=>modal.classList.add('is-open'));

}

function closeModal(){
  const modal=document.getElementById('modal');
  modal.classList.remove('is-open');
  modalCloseTimer=setTimeout(()=>{
    modal.style.display='none';
    document.getElementById('modalBody').innerHTML='';
    modalCloseTimer=null;
  },180);
}

</script>
